server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: outreach-console

  datasource:
    url: jdbc:h2:file:./data/outreach;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"
  global-config:
    banner: false
    db-config:
      id-type: input

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # springdoc 2.6.x 与 Spring Framework 6.2 的兼容开关：关闭全局响应覆盖，避免 @ControllerAdvice 反射不兼容
  override-with-generic-response: false

app:
  simulator:
    enabled: true
    interval-ms: 2000
  websocket:
    push-interval-ms: 2000

logging:
  level:
    root: info
    com.yicheng.outreach: info
