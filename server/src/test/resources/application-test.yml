spring:
  datasource:
    url: jdbc:h2:mem:outreach_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

app:
  simulator:
    enabled: false
  websocket:
    push-interval-ms: 60000

logging:
  level:
    root: warn
    com.yicheng.outreach: info
